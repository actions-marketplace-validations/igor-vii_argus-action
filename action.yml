name: 'Argus Action'
description: 'Runs the real Argus engine (sealed bundle) against your SUT in CI: real protocol sessions, real refusal points.'
branding:
  icon: 'shield'
  color: 'blue'
inputs:
  console-url:
    description: 'Argus console base URL'
    required: true
  console-api-key:
    description: 'Argus API key (one key, one balance)'
    required: true
  battery:
    description: 'Battery id; defaults to the battery declared in argus.sut.json'
    required: false
    default: ''
  sut-contract-path:
    description: 'Path to the SUT contract'
    required: false
    default: 'argus.sut.json'
  bundle-keys-path:
    description: 'Override for bundle public keys; by default the keys pinned in this action are used (never from the SUT repo)'
    required: false
    default: ''
  public-run:
    description: 'Publish the run report page (default: private)'
    required: false
    default: 'false'
  comment:
    description: 'Post/update a single PR comment with the session table (opt-in)'
    required: false
    default: 'false'
  baseline-fixture:
    description: 'Path (repo-relative) to a previous argus-result.json — enables drift annotations (P1-6)'
    required: false
    default: ''
  github-token:
    description: 'GitHub token for the check-run billboard and the opt-in comment'
    required: false
    default: ''
outputs:
  run-id:
    description: 'Argus run id'
  run-url:
    description: 'Run report URL'
  rollup:
    description: 'PASS / FAIL / DOCUMENTED / HARNESS_ERROR'
  engine-version:
    description: 'Engine semver from the sealed bundle'
runs:
  using: 'node20'
  main: 'dist/index.js'
